    <style>
        :root { --bg-color: #f9f8f5; --text-color: #2c2c2c; --accent-color: #8c8c8c; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Montserrat', 'Noto Serif TC', serif; margin: 0; }
        
        header { 
            padding: 2rem 5%; display: flex; justify-content: space-between; align-items: center; 
            position: fixed; width: 100%; background: rgba(249, 248, 245, 0.9); backdrop-filter: blur(5px); z-index: 1000; 
        }

        .dropdown { position: relative; display: inline-block; }
        .menu-icon { background: none; border: none; cursor: pointer; padding: 10px; display: flex; flex-direction: column; gap: 5px; }
        .menu-icon span { display: block; width: 25px; height: 1px; background-color: var(--text-color); transition: 0.3s; }
        .dropdown-content { display: none; position: absolute; top: 100%; left: 0; background-color: var(--bg-color); min-width: 200px; box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.05); z-index: 1; padding: 1rem 0; }
        .dropdown-content a { color: var(--text-color); padding: 12px 24px; text-decoration: none; display: block; font-size: 0.9rem; letter-spacing: 0.1rem; transition: 0.3s; }
        .dropdown-content a:hover { background-color: #f0efeb; color: var(--accent-color); }
        .dropdown:hover .dropdown-content { display: block; }

        .logo { font-size: 1.2rem; letter-spacing: 0.3rem; font-weight: 500; text-transform: uppercase; text-decoration: none; color: var(--text-color); position: absolute; left: 50%; transform: translateX(-50%); }

        .side-selector {
            position: fixed;
            left: 3%;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 2rem;
            z-index: 900;
        }

        .side-selector a {
            text-decoration: none;
            font-size: 0.75rem;
            letter-spacing: 0.15rem;
            color: var(--accent-color);
            text-transform: uppercase;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            transition: all 0.3s ease;
            padding: 15px 0;
            border-left: 1px solid transparent;
            font-family: 'Noto Serif TC', serif;
        }

        .side-selector a.active {
            color: var(--text-color);
            font-weight: 500;
            border-left: 1px solid var(--text-color);
        }

        .container { padding: 10rem 12% 5%; text-align: center; }
        h1 { font-family: 'Noto Serif TC', serif; font-weight: 300; margin-bottom: 1.5rem; letter-spacing: 0.2rem; }
        
        .intro-text { font-family: 'Noto Serif TC', serif; max-width: 600px; margin: 0 auto 5rem; color: var(--accent-color); font-size: 0.95rem; line-height: 2; letter-spacing: 0.05rem; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 4rem; text-align: center; }
        .product-card { margin-bottom: 2rem; opacity: 0.6; }
        .product-image { width: 100%; max-width: 400px; aspect-ratio: 1 / 1; object-fit: cover; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; background: #eee; color: #aaa; font-style: italic; }

        .product-card h3 { font-family: 'Noto Serif TC', serif; margin-bottom: 0.5rem; font-weight: 500; }
        .product-card p { font-size: 0.9rem; color: var(--accent-color); padding: 0 1rem; line-height: 1.6; }
        
        footer { padding: 4rem; font-size: 0.8rem; color: var(--accent-color); text-align: center; }

        @media (max-width: 768px) {
            .side-selector { position: relative; top: 0; left: 0; transform: none; flex-direction: row; justify-content: center; padding: 7rem 0 1rem; width: 100%; gap: 2rem; }
            .side-selector a { writing-mode: horizontal-tb; padding: 5px 0; border-left: none; border-bottom: 1px solid transparent; }
            .side-selector a.active { border-left: none; border-bottom: 1px solid var(--text-color); }
            .container { padding: 2rem 10% 5%; }
        }
    </style>
</head>
