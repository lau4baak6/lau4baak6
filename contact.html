    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;500&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #f9f8f5; --text-color: #2c2c2c; --accent-color: #8c8c8c; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Montserrat', 'Noto Serif TC', serif; line-height: 2; }
        
        header { 
            padding: 2rem 5%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: fixed; 
            width: 100%; 
            background: rgba(249, 248, 245, 0.9); 
            backdrop-filter: blur(5px); 
            z-index: 1000; 
        }

        /* Dropdown Menu Styling */
        .dropdown { position: relative; display: inline-block; }
        .menu-icon {
            background: none; border: none; cursor: pointer; padding: 10px;
            display: flex; flex-direction: column; gap: 5px;
        }
        .menu-icon span {
            display: block; width: 25px; height: 1px;
            background-color: var(--text-color); transition: 0.3s;
        }
        .dropdown-content {
            display: none; position: absolute; top: 100%; left: 0;
            background-color: var(--bg-color); min-width: 200px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.05); z-index: 1; padding: 1rem 0;
        }
        .dropdown-content a {
            color: var(--text-color); padding: 12px 24px; text-decoration: none;
            display: block; font-size: 0.9rem; letter-spacing: 0.1rem; transition: 0.3s;
        }
        .dropdown-content a:hover { background-color: #f0efeb; color: var(--accent-color); }
        .dropdown:hover .dropdown-content { display: block; }

        .logo { 
            font-size: 1.2rem; letter-spacing: 0.3rem; font-weight: 500;
            text-transform: uppercase; text-decoration: none; color: var(--text-color);
            position: absolute; left: 50%; transform: translateX(-50%);
        }

        /* Contact Content Wrapper */
        .contact-wrapper {
            padding: 15rem 10% 8rem;
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-family: 'Noto Serif TC', serif;
            font-weight: 300;
            font-size: 1.8rem;
            letter-spacing: 0.4rem;
            margin-bottom: 4rem;
        }

        /* Minimalist Instagram Icon Button */
        .instagram-button {
            display: inline-block;
            transition: opacity 0.3s ease, transform 0.3s ease;
            text-decoration: none;
            margin-bottom: 2rem;
        }
        
        .instagram-button svg {
            width: 45px;
            height: 45px;
            fill: var(--text-color);
        }

        .instagram-button:hover {
            opacity: 0.6;
            transform: translateY(-2px);
        }

        .order-text {
            font-family: 'Noto Serif TC', serif;
            font-size: 1rem;
            letter-spacing: 0.15rem;
            color: var(--accent-color);
        }

        .divider {
            height: 40px;
            width: 1px;
            background-color: var(--text-color);
            margin-bottom: 3rem;
            opacity: 0.2;
        }

        footer { text-align: center; padding: 4rem; font-size: 0.8rem; color: var(--accent-color); }
    </style>
