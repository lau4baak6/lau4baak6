<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Story | lau4baak6</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;500&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #f9f8f5; --text-color: #2c2c2c; --accent-color: #8c8c8c; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Montserrat', 'Noto Serif TC', serif; line-height: 2; }
        
        header { padding: 2rem 5%; display: flex; justify-content: center; align-items: center; position: fixed; width: 100%; background: rgba(249, 248, 245, 0.9); backdrop-filter: blur(5px); z-index: 1000; }
        .logo { font-size: 1.2rem; letter-spacing: 0.3rem; text-decoration: none; color: var(--text-color); text-transform: uppercase; font-weight: 500; }

        .story-wrapper {
            padding: 12rem 10% 8rem;
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }

        /* The Main Brand Quote */
        .brand-quote {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.6rem;
            letter-spacing: 0.5rem;
            margin-bottom: 4rem;
            font-weight: 300;
            line-height: 2.5;
            color: var(--text-color);
        }

        /* The Brand Mission Paragraph */
        .brand-mission {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.1rem;
            color: var(--accent-color);
            margin-bottom: 5rem;
            letter-spacing: 0.1rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .divider {
            height: 60px;
            width: 1px;
            background-color: var(--text-color);
            margin: 0 auto 3rem;
            opacity: 0.3;
        }

        /* The CTA Button - Matching Index.html style */
        .cta-button { 
            display: inline-block; 
            padding: 1rem 2.5rem; 
            border: 1px solid var(--text-color); 
            text-decoration: none; 
            color: var(--text-color); 
            transition: all 0.3s ease; 
            font-size: 0.9rem;
            letter-spacing: 0.2rem;
            text-transform: uppercase;
            margin-top: 2rem;
        }

        .cta-button:hover { 
            background-color: var(--text-color); 
            color: white; 
        }

        footer { text-align: center; padding: 4rem; font-size: 0.8rem; color: var(--accent-color); letter-spacing: 0.1rem; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">lau4baak6</a>
    </header>

    <div class="story-wrapper">
        <div class="divider"></div>
        
        <div class="brand-quote">
            生活不必填滿每一刻<br>
            留下一片空白<br>
            讓光影與香氣流動<br>
            在靜謐之中<br>
            感受時光<br>
            感受自己
        </div>

        <div class="divider" style="height: 30px;"></div>

        <div class="brand-mission">
            我們是源自香港的手工蠟燭品牌，致力於將藝術靈感與簡約美學融入生活。主打環保沙蠟，我們積極與本土品牌合作，在推廣環保與循環重用理念的同時，為您的空間營造一份純粹的靜謐感。
        </div>

        <a href="collection.html" class="cta-button">Browse Collection</a>
    </div>

    <footer>&copy; 2026 lau4baak6 留白生活</footer>

</body>
</html>
