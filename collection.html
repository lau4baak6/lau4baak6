<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collection | lau4baak6</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;500&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #f9f8f5; --text-color: #2c2c2c; --accent-color: #8c8c8c; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Montserrat', 'Noto Serif TC', serif; margin: 0; }
        
        /* Updated Header Styling to support Dropdown */
        header { 
            padding: 2rem 5%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: fixed; 
            width: 100%; 
            background: rgba(249, 248, 245, 0.9); 
            backdrop-filter: blur(5px); 
            z-index: 1000; 
        }

        /* Dropdown Menu Styling (Same as Index) */
        .dropdown {
            position: relative;
            display: inline-block;
        }

        .menu-icon {
            background: none;
            border: none;
            cursor: pointer;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .menu-icon span {
            display: block;
            width: 25px;
            height: 1px;
            background-color: var(--text-color);
            transition: 0.3s;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background-color: var(--bg-color);
            min-width: 200px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.05);
            z-index: 1;
            padding: 1rem 0;
        }

        .dropdown-content a {
            color: var(--text-color);
            padding: 12px 24px;
            text-decoration: none;
            display: block;
            font-size: 0.9rem;
            letter-spacing: 0.1rem;
            transition: 0.3s;
        }

        .dropdown-content a:hover {
            background-color: #f0efeb;
            color: var(--accent-color);
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .logo { 
            font-size: 1.2rem; 
            letter-spacing: 0.3rem; 
            font-weight: 500; 
            text-transform: uppercase; 
            text-decoration: none; 
            color: var(--text-color);
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Container and Grid Styling */
        .container { padding: 10rem 10% 5%; }
        h1 { font-family: 'Noto Serif TC', serif; font-weight: 300; margin-bottom: 3rem; text-align: center; letter-spacing: 0.2rem; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 4rem; }
        .product-card { text-align: center; }
        
        .product-image {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
            margin: 0 auto 1.5rem;
            filter: grayscale(10%);
            transition: transform 0.4s ease;
        }

        .product-image:hover { transform: scale(1.03); }

        .product-card h3 { font-family: 'Noto Serif TC', serif; margin-bottom: 0.5rem; font-weight: 500; }
        .product-card p { font-size: 0.9rem; color: var(--accent-color); padding: 0 1rem; }
        
        footer { text-align: center; padding: 4rem; font-size: 0.8rem; color: var(--accent-color); }
    </style>
</head>
<body>

                <a href="contact.html">Contact Us</a>
            </div>
        </div>

        <a href="index.html" class="logo">lau4baak6</a>
        
        <div style="width: 45px;"></div> </header>
