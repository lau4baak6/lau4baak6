<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lau4baak6 | 留白生活</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;500&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #f9f8f5; --text-color: #2c2c2c; --accent-color: #8c8c8c; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Montserrat', 'Noto Serif TC', serif; line-height: 1.6; }
        
        /* Navigation Header */
        header { 
            padding: 2rem 5%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: fixed; 
            width: 100%; 
            background: rgba(249, 248, 245, 0.9); 
            backdrop-filter: blur(5px); 
            z-index: 1000; 
        }

        /* Dropdown Menu Styling */
        .dropdown {
            position: relative;
            display: inline-block;
        }

        .menu-icon {
            background: none;
            border: none;
            cursor: pointer;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .menu-icon span {
            display: block;
            width: 25px;
            height: 1px;
            background-color: var(--text-color);
            transition: 0.3s;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background-color: var(--bg-color);
            min-width: 200px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.05);
            z-index: 1;
            padding: 1rem 0;
        }

        .dropdown-content a {
            color: var(--text-color);
            padding: 12px 24px;
            text-decoration: none;
            display: block;
            font-size: 0.9rem;
            letter-spacing: 0.1rem;
            transition: 0.3s;
        }

        .dropdown-content a:hover {
            background-color: #f0efeb;
            color: var(--accent-color);
        }

        /* Show the dropdown on hover or click (CSS hover for simple preview) */
        .dropdown:hover .dropdown-content {
            display: block;
        }

        .logo { 
            font-size: 1.2rem; 
            letter-spacing: 0.3rem; 
            font-weight: 500; 
            text-transform: uppercase; 
            text-decoration: none; 
            color: var(--text-color);
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Hero Content */
        section { padding: 10rem 10% 5rem; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;}
        .hero h1 { font-family: 'Noto Serif TC', serif; font-size: 3.5rem; margin-bottom: 1rem; letter-spacing: 0.5rem; font-weight: 300; }
        .hero p { font-size: 1.1rem; color: var(--accent-color); letter-spacing: 0.2rem; }
        
        .cta-button { 
            display: inline-block; 
            margin-top: 3rem; 
            padding: 1rem 2.5rem; 
            border: 1px solid var(--text-color); 
            text-decoration: none; 
            color: var(--text-color); 
            transition: 0.3s; 
        }
        .cta-button:hover { background-color: var(--text-color); color: white; }
        
        footer { text-align: center; padding: 4rem; font-size: 0.8rem; color: var(--accent-color); }
    </style>
</head>
<body>
    <header>
        <div class="dropdown">
            <button class="menu-icon">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <div class="dropdown-content">
                <a href="collection.html">Browse Collection</a>
                <a href="#">Contact Us</a>
                <a href="index.html">Home</a>
            </div>
        </div>

        <a href="index.html" class="logo">lau4baak6</a>
        
        <div style="width: 45px;"></div> </header>

    <section class="hero">
        <h1>留白生活</h1>
        <p>生活也需要留白</p>
        <a href="collection.html" class="cta-button">Browse Collection</a>
    </section>

    <footer>&copy; 2026 lau4baak6 留白生活</footer>
</body>
</html>
